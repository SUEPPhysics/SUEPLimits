    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHSsr1 --variable I_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 40 50 --input=config/WH_inputs_{era}.yaml --era={era}"
