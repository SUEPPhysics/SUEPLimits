runcards:
  commands:
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crA --variable A_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crB --variable B_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crC --variable C_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crD --variable D_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crE --variable E_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin0crF --variable F_SUEP_nconst_Cluster70 --stack {n} expected data --bins 70 90 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin1crF --variable F_SUEP_nconst_Cluster70 --stack {n} expected data --bins 90 110 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin2crF --variable F_SUEP_nconst_Cluster70 --stack {n} expected data --bins 110 130 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin3crF --variable F_SUEP_nconst_Cluster70 --stack {n} expected data --bins 130 170 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin4crF --variable F_SUEP_nconst_Cluster70 --stack {n} expected data --bins 170 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crG --variable G_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel cat_crH --variable H_SUEP_nconst_Cluster70 --stack {n} expected data --bins 0 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin1Sig --variable I_SUEP_nconst_Cluster70 --stack {n} expected data --bins 90 110 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin2Sig --variable I_SUEP_nconst_Cluster70 --stack {n} expected data --bins 110 130 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin3Sig --variable I_SUEP_nconst_Cluster70 --stack {n} expected data --bins 130 170 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
    - "python3 makeOfflineDataCard.py --tag {tag} --channel Bin4Sig --variable I_SUEP_nconst_Cluster70 --stack {n} expected data --bins 170 2000 --input=config/PRL_SUEP_inputs_{era}.yaml --era={era}"
  eras:
    - '2018'
    - '2017'
    - '2016'
  config:
    "config/PRL_SUEP_inputs_{era}.yaml"

