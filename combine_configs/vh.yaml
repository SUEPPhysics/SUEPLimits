runcombine:
  text2workspace_command: text2workspace.py -m 125 cards-{name}/{name}.dat -o cards-{name}/{name}.root
  combine_command: combine --datacard cards-{name}/{name}.root {combine_method} -m 125 --cl 0.95 --name {name} {options} --rAbsAcc 0.000001 --rRelAcc 0.01 --X-rtd MINIMIZER_analytic --X-rtd FAST_VERTICAL_MORPH
