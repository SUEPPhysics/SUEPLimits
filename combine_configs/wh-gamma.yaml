    GJHScrF0all=cards-{name}/shapes-GJHScrF0all.dat 
    GJHScrF1all=cards-{name}/shapes-GJHScrF1all.dat 
    GJHScrF2all=cards-{name}/shapes-GJHScrF2all.dat 
    GJHScrF3all=cards-{name}/shapes-GJHScrF3all.dat 
    GJHScrF4all=cards-{name}/shapes-GJHScrF4all.dat 
    GJHScrGall=cards-{name}/shapes-GJHScrGall.dat 
    GJHScrHall=cards-{name}/shapes-GJHScrHall.dat 
    GJHSsr0all=cards-{name}/shapes-GJHSsr0all.dat 
    GJHSsr1all=cards-{name}/shapes-GJHSsr1all.dat 
    GJHSsr2all=cards-{name}/shapes-GJHSsr2all.dat 
    GJHSsr3all=cards-{name}/shapes-GJHSsr3all.dat 
