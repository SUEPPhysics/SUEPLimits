runcards:
  commands:
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrA --variable A_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrB --variable B_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrC --variable C_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrD --variable D_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrE --variable E_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrF0 --variable F_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 30 40 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrF1 --variable F_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 40 50 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrF2 --variable F_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 50 60 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrF3 --variable F_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 60 80 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrF4 --variable F_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 80 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrG --variable G_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHScrH --variable H_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 0 2000 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHSsr0 --variable I_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 30 40 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHSsr1 --variable I_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 40 50 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHSsr2 --variable I_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 50 60 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHSsr3 --variable I_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 60 80 --era all"
    - "python3 makeWHDataCard.py --gamma --tag {tag} --channel GJHSsr4 --variable I_SUEP_nconst_VRGJhighS --stack {n} GJHSexpected GJHSdata --bins 80 2000 --era all"
  samples:
    - SUEP_mS125.000_mPhi2.000_T0.500_modegeneric
    - SUEP_mS125.000_mPhi2.000_T1.000_modegeneric
    - SUEP_mS125.000_mPhi2.000_T2.000_modegeneric
    - SUEP_mS125.000_mPhi2.000_T4.000_modegeneric
    - SUEP_mS125.000_mPhi2.000_T8.000_modegeneric
    - SUEP_mS125.000_mPhi3.000_T0.750_modegeneric
    - SUEP_mS125.000_mPhi3.000_T1.500_modegeneric
    # - SUEP_mS125.000_mPhi3.000_T12.000_modegeneric
    - SUEP_mS125.000_mPhi3.000_T3.000_modegeneric
    - SUEP_mS125.000_mPhi3.000_T6.000_modegeneric
    - SUEP_mS125.000_mPhi4.000_T1.000_modegeneric
    # - SUEP_mS125.000_mPhi4.000_T16.000_modegeneric
    - SUEP_mS125.000_mPhi4.000_T2.000_modegeneric
    - SUEP_mS125.000_mPhi4.000_T4.000_modegeneric
    - SUEP_mS125.000_mPhi4.000_T8.000_modegeneric
    #- SUEP_mS125.000_mPhi8.000_T16.000_modegeneric
    - SUEP_mS125.000_mPhi8.000_T2.000_modegeneric
    # - SUEP_mS125.000_mPhi8.000_T32.000_modegeneric
    - SUEP_mS125.000_mPhi8.000_T4.000_modegeneric
    - SUEP_mS125.000_mPhi8.000_T8.000_modegeneric

