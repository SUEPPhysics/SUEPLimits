    - "python3 makeWHDataCard.py --tag {tag} --channel WJHSsr2 --variable I_SUEP_nconst_SR --stack {n} WJHSexpected WJHSdata --bins 50 60 --input=config/WH_inputs_{era}.yaml --era={era}"
