data_file: signal_efficiency_table.yaml
description: 'Per-selection efficiencies on Generic - $m_{A''} = 1.0\;GeV$ $BR(A''
  \rightarrow \pi\pi) = 1.0$

  Hadronic - $m_{A''} = 0.7\;GeV$ and $BR(A'' \rightarrow ee) = BR(A'' \rightarrow
  \mu\mu) = 0.15$ $BR(A'' \rightarrow \pi\pi) = 0.7$

  Leptonic - $m_{A''} = 0.5\;GeV$ and $BR(A'' \rightarrow ee) = BR(A'' \rightarrow
  \mu\mu) = 0.2$ and $BR(A'' \rightarrow \pi\pi) = 0.6$ samples.

  Selections: 2 OSSF leptons, one SUEP cluster, $60\leq Z_{m}\leq 120$ GeV, $p_{T}^Z\geq
  25$ GeV, veto events with b-tagged jets, $p_{T}^{SUEP} > 60\;GeV$, and $dR^{Ak4}_{Ak15}
  < 1.5$.

  Efficiencies are the ratio of the histogram size at the selection step to the previous
  step (except twoLepton vs. initial). The final column is the total cumulative efficiency
  (dR vs. initial).

  Note that these selection numbers were all calculated using samples generated with
  600,000 events for each signal point considered.'
keywords: []
location: Signal efficiencies from internal selection studies.
name: Signal Efficiency Table
